name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Websiter.slnx

      - name: Build
        run: dotnet build Websiter.slnx -c Release --nologo

      - name: Test
        run: dotnet test Websiter.slnx -c Release --no-build --nologo

      - name: Vulnerable package check
        run: dotnet list Websiter.slnx package --vulnerable --include-transitive
        continue-on-error: true

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify formatting
        run: dotnet format Websiter.slnx --verify-no-changes --nologo || true

  cli-e2e:
    name: CLI end-to-end (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build CLI
        run: dotnet build src/Websiter.CLI -c Release --nologo
      - name: Scaffold + build generated app
        run: |
          set -e
          CLI=src/Websiter.CLI/bin/Release/net10.0/websiter
          chmod +x "$CLI" 2>/dev/null || true
          dotnet "$CLI.dll" new CiSite --template basic --dir /tmp/ws-e2e --non-interactive
          dotnet build /tmp/ws-e2e/CiSite/CiSite.csproj -c Release --nologo
