name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  pack:
    name: Pack NuGet packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet pack Websiter.slnx -c Release -o artifacts --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  cli-binaries:
    name: Build CLI binaries (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained CLI
        run: >
          dotnet publish src/Websiter.CLI/Websiter.CLI.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -o cli-${{ matrix.rid }}
      - name: Archive
        shell: bash
        run: |
          cd cli-${{ matrix.rid }}
          zip -r ../websiter-cli-${{ matrix.rid }}.zip .
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: websiter-cli-${{ matrix.rid }}.zip

  nuget:
    name: Push to nuget.org
    needs: pack
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - name: Push packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: GitHub Release
    needs: [pack, cli-binaries]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            cli/*.zip
          generate_release_notes: true
